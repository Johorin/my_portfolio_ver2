services:
  frontend:
    build:
      context: ./frontend
    tty: true
    restart: always
    volumes:
      - ./frontend:/app
    environment:
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run dev"
    # command: sh -c "yarn install && yarn dev" # yarnだとうまくいかない
    ports:
      - "3000:3000"
    networks:
      - myportfolio

  backend:
    build:
      context: ./backend
    tty: true
    restart: always
    volumes:
      - ./backend:/app
    environment:
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run dev"
    ports:
      - "4000:4000"
      - "5555:5555" # prisma port
    networks:
      - myportfolio

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: myportfolio
      MYSQL_USER: local
      MYSQL_PASSWORD: password
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3306:3306"
    networks:
      - myportfolio

networks:
  myportfolio:
    external: true