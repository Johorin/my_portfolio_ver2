services:
  frontend:
    build:
      context: ./frontend
    tty: true
    restart: always
    volumes:
      - ./frontend:/app
    environment:
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run dev"
    # command: sh -c "yarn install && yarn dev" # yarnだとうまくいかない
    ports:
      - "3000:3000"

  ## viteがうまくいかないので使わん
  # vite:
  #   build:
  #     context: ./frontend
  #   tty: true
  #   restart: always
  #   volumes:
  #     - ./frontend:/app
  #   environment:
  #     - WATCHPACK_POLLING=true
  #   # コンテナ立ち上げの際に実行するコマンド（ローカルサーバー起動）
  #   command: sh -c "npm install && npm run vite --host"
  #   ports:                                                                       
  #     - "5173:5173"

  backend:
    build:
      context: ./backend
    tty: true
    restart: always
    volumes:
      - ./backend:/app
    environment:
      - WATCHPACK_POLLING=true
    command: sh -c "yarn install && yarn run dev"
    ports:
      - "4000:4000"

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: myportfolio
      MYSQL_USER: local
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"